name: Godot export

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: godot-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with MindStakes.csproj (Godot.NET.Sdk) and project.godot (config/features).
  GODOT_VERSION: 4.6.1-stable

jobs:
  export:
    name: Export game builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot editor and export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-${{ runner.os }}

      - name: Install Godot editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -x "$HOME/godot/godot" ]; then
            echo "Godot already cached."
            exit 0
          fi
          mkdir -p "$HOME/godot"
          gh release download "${GODOT_VERSION}" --repo godotengine/godot \
            --pattern "Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip" -d "$RUNNER_TEMP/godot"
          cp -a "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/." "$HOME/godot/"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          ln -sf "$HOME/godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64" "$HOME/godot/godot"

      - name: Install export templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if compgen -G "$HOME/.local/share/godot/export_templates/*.mono/version.txt" > /dev/null; then
            echo "Export templates already cached."
            exit 0
          fi
          gh release download "${GODOT_VERSION}" --repo godotengine/godot \
            --pattern "Godot_v${GODOT_VERSION}_mono_export_templates.tpz" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/Godot_v${GODOT_VERSION}_mono_export_templates.tpz" -d "$RUNNER_TEMP/templates"
          version="$(cat "$RUNNER_TEMP/templates/templates/version.txt")"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv "$RUNNER_TEMP/templates/templates" "$HOME/.local/share/godot/export_templates/${version}"

      - name: Import project
        run: |
          "$HOME/godot/godot" --headless --path "$GITHUB_WORKSPACE" --import

      - name: Export Windows build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          "$HOME/godot/godot" --headless --path "$GITHUB_WORKSPACE" \
            --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/windows/MindStakes.exe"

      - name: Export Linux build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/linux"
          "$HOME/godot/godot" --headless --path "$GITHUB_WORKSPACE" \
            --export-release "Linux" "$GITHUB_WORKSPACE/build/linux/MindStakes.x86_64"

      - name: Package builds
        run: |
          (cd build/windows && zip -qr "$GITHUB_WORKSPACE/mindstakes-windows-x86_64.zip" .)
          (cd build/linux && zip -qr "$GITHUB_WORKSPACE/mindstakes-linux-x86_64.zip" .)
          ls -lh "$GITHUB_WORKSPACE"/mindstakes-*.zip

      - name: Upload builds
        uses: actions/upload-artifact@v7
        with:
          name: mindstakes-builds
          path: mindstakes-*.zip
          retention-days: 14

  release:
    name: Publish release
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          name: mindstakes-builds

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mindstakes-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "MindStakes $GITHUB_REF_NAME" \
            --generate-notes
