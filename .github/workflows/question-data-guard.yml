name: question-data-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail when question data is committed
        run: |
          unexpected="$(git ls-files 'Resources/Questions/Pool*' | grep -v -E '^Resources/Questions/Pool1/(1|2)\.tres$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Question data must stay outside the repository. See README.md -> Question data."
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "Only the sample pool is tracked."
