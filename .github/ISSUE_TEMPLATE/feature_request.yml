name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap at the bottom of the [README](https://github.com/6ajmon/MindStakes/blob/main/README.md) first: some features are already planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation that is awkward or impossible today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Game modes
        - Scoring
        - Question Creator
        - Categories
        - Import / export of question data
        - Localization
        - UI / theming
        - Developer tooling / CI
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am willing to open a pull request for this.
          required: false
