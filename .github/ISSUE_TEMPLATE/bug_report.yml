name: Bug report
description: Report something that does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search the existing issues first, and keep question data (questions, answers, `.tres` files) out of the report.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a game in Betting mode
        2. Bet 20 points
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Title screen
        - Team creation
        - Game mode selection
        - Category selection
        - Betting mode
        - Fraud mode
        - Sabotage mode
        - Question screen
        - Scoring / summary
        - Question Creator
        - Other
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Build
      description: Release version, or the commit SHA when running from source.
      placeholder: v1.0.0 / 1a2b3c4
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system and Godot version
      placeholder: Windows 11, exported build / Ubuntu 24.04, Godot 4.6.1 .NET
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag images here, or paste the console output.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This report contains no question data or answers.
          required: true
